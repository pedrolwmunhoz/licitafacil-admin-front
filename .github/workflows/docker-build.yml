name: CI/CD Pipeline

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: "1 - Build & Push Docker"
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ponto-eletronico-admin-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ponto-eletronico-admin-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "2 - Deploy ArgoCD"
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar config repo com tag da imagem
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.GIT_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$CONFIG_REPO_TOKEN" ]; then
            echo "::error::GIT_TOKEN não definido. Configure o secret no repositório para permitir push no config repo."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/pedrolwmunhoz/ponto-eletronico-admin-front-config.git" config-repo
          cd config-repo
          sed -i "s|ponto-eletronico-admin-frontend:[^\"]*|ponto-eletronico-admin-frontend:${IMAGE_TAG}|g" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --staged --quiet && echo "Nenhuma alteração" || (git commit -m "chore: image tag ${IMAGE_TAG}" && git push)

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      - name: Login no ArgoCD
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username admin \
            --password '${{ secrets.ARGOCD_AUTH_TOKEN }}' \
            --insecure \
            --grpc-web

      - name: Sync da Application
        run: |
          argocd app sync ponto-eletronico-admin-frontend \
            --grpc-web \
            --force \
            --prune

      - name: Aguardar deploy saudável
        run: |
          argocd app wait ponto-eletronico-admin-frontend \
            --grpc-web \
            --health \
            --timeout 300

      - name: Status final
        if: always()
        run: |
          argocd app get ponto-eletronico-admin-frontend --grpc-web || true
